<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Softrot</title>
  <style>
    :root {
      --viewport-height: 100dvh;
      --usable-height: calc(var(--viewport-height) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      --usable-width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #69757d; color: #fff; }
    html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    button { font: inherit; touch-action: manipulation; }

    /* ---------- Existing feed, using free continuous scrolling ---------- */
    #atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #69757d;
      isolation: isolate;
    }
    #atmosphere::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: rgba(25, 34, 40, .12);
      pointer-events: none;
    }
    #app { position: fixed; inset: 0; height: var(--viewport-height); z-index: 1; background: transparent; opacity: 0; pointer-events: none; transition: opacity 1100ms cubic-bezier(.22,.61,.36,1); }
    #app.entered { opacity: 1; pointer-events: auto; }
    #feed {
      display: flex;
      flex-direction: column;
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: none;
      touch-action: pan-y pinch-zoom;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      background: transparent;
    }
    #feed::-webkit-scrollbar { display: none; }
    .video-slide {
      flex-shrink: 0;
      position: relative;
      width: 100vw;
      height: 100dvh;
      min-height: 100dvh;
      padding: 0;
      display: grid;
      place-items: center;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: transparent;
    }
    .phone {
      position: relative;
      width: min(var(--usable-width), calc(var(--usable-height) * 9 / 16));
      height: min(var(--usable-height), calc(var(--usable-width) * 16 / 9));
      min-width: 200px;
      min-height: 200px;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #69757d;
    }
    @media (max-width: 700px), (pointer: coarse) {
      .phone {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        min-width: 200px;
        min-height: 200px;
        max-width: none;
        max-height: none;
      }
    }
    .player-host,
    .player-host iframe { width: 100% !important; height: 100% !important; }
    .player-host { position: absolute; inset: 0; background: #69757d; }
    .video-slide.visual-pending iframe { opacity: 0; }
    .shade { display: none; }
    #rainToggle {
      position: fixed;
      left: calc(14px + env(safe-area-inset-left, 0px));
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 40;
      border: 0;
      border-radius: 999px;
      padding: 8px 11px;
      background: rgba(0, 0, 0, .42);
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
      line-height: 1;
      letter-spacing: .02em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity .2s ease, background .2s ease;
      opacity: .72;
    }
    #rainToggle:hover { opacity: 1; }
    #rainToggle[aria-pressed="false"] {
      background: rgba(0, 0, 0, .28);
      color: rgba(255, 255, 255, .46);
    }

    #autoplayToggle {
      position: fixed;
      right: calc(14px + env(safe-area-inset-right, 0px));
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 40;
      border: 0;
      border-radius: 999px;
      padding: 8px 11px;
      background: rgba(0, 0, 0, .42);
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
      line-height: 1;
      letter-spacing: .02em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity .2s ease, background .2s ease;
      opacity: .72;
    }
    #autoplayToggle:hover { opacity: 1; }
    #autoplayToggle[aria-pressed="false"] {
      background: rgba(0, 0, 0, .28);
      color: rgba(255, 255, 255, .46);
    }
    #rainToggle,
    #autoplayToggle {
      opacity: 0;
      pointer-events: none;
    }
    body.feed-live #rainToggle,
    body.feed-live #autoplayToggle {
      opacity: .16;
      pointer-events: auto;
    }
    body.feed-live.controls-awake #rainToggle,
    body.feed-live.controls-awake #autoplayToggle { opacity: .58; }
    body.feed-live #rainToggle:hover,
    body.feed-live #autoplayToggle:hover { opacity: 1; }

    #message {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      padding: 28px;
      text-align: center;
      background: #000;
      color: #fff;
    }

    /* ---------- Softrot intro ---------- */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 20;
      height: var(--viewport-height);
      touch-action: pan-y;
      overscroll-behavior: contain;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background: transparent;
      opacity: 1;
      transition: transform 850ms cubic-bezier(.22,.61,.36,1);
      isolation: isolate;
    }
    #intro.leaving { transform: translateY(-100%); pointer-events: none; }

    .cloud-field,
    #rainVisual {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .cloud-field { z-index: -3; }
    #rainVisual { z-index: -1; opacity: .78; }

    .cloud {
      position: absolute;
      width: 32vw;
      min-width: 300px;
      max-width: 620px;
      aspect-ratio: 2.25 / 1;
      border-radius: 50%;
      background: rgba(213, 220, 223, .14);
      filter: blur(28px);
      opacity: .9;
      will-change: transform;
      animation: cloudDrift linear infinite alternate;
    }
    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }
    .cloud::before { width: 58%; height: 92%; left: 6%; top: -24%; }
    .cloud::after { width: 48%; height: 82%; right: 8%; top: -14%; }
    .cloud.c1 { left: -10vw; top: 8%; animation-duration: 78s; }
    .cloud.c2 { right: -8vw; top: 24%; opacity: .66; animation-duration: 96s; animation-delay: -32s; }
    .cloud.c3 { left: 18vw; top: 58%; opacity: .48; animation-duration: 112s; animation-delay: -61s; }
    .cloud.c4 { right: 14vw; top: 73%; opacity: .38; animation-duration: 124s; animation-delay: -18s; }
    @keyframes cloudDrift {
      from { transform: translate3d(-4vw, 0, 0) scale(1); }
      to   { transform: translate3d(8vw, 1.5vh, 0) scale(1.04); }
    }

    .rain-drop {
      position: absolute;
      top: -14vh;
      width: 1px;
      height: var(--len, 16px);
      background: rgba(232, 239, 242, var(--alpha, .16));
      transform: translate3d(0, -10vh, 0) rotate(5deg);
      will-change: transform;
      animation: rainFall var(--dur, 2.4s) linear infinite;
      animation-delay: var(--delay, 0s);
    }
    @keyframes rainFall {
      to { transform: translate3d(4vw, 124vh, 0) rotate(5deg); }
    }

    #soundPrompt {
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
      border: 0;
      background: transparent;
      color: rgba(239, 242, 242, .58);
      padding: 18px 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: .02em;
      text-transform: lowercase;
      transition: opacity 650ms ease;
      z-index: 6;
    }
    #soundPrompt.fading { opacity: 0; pointer-events: none; }
    #soundPrompt:hover { color: rgba(246, 248, 248, .72); }

    #introCopy {
      position: relative;
      z-index: 2;
      width: min(86vw, 540px);
      max-width: 100%;
      text-align: center;
      color: rgba(246, 247, 246, .88);
      transform: translateY(1vh);
      pointer-events: none;
    }
    .reveal {
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 1050ms ease, transform 1050ms ease;
    }
    .reveal.shown { opacity: 1; transform: translateY(0); }
    #softrotTitle {
      margin: 0 0 28px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(46px, 8vw, 68px);
      line-height: .98;
      font-weight: 400;
      letter-spacing: -.025em;
    }
    #manifesto {
      margin: 0 auto;
      font-size: clamp(14px, 2.5vw, 16px);
      line-height: 1.65;
      color: rgba(244, 246, 246, .72);
    }
    #scrollLine {
      margin: 20px auto 0;
      font-size: clamp(14px, 2.5vw, 16px);
      line-height: 1.6;
      color: rgba(244, 246, 246, .68);
    }

    #tagline {
      margin: 25px auto 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(15px, 2.7vw, 17px);
      line-height: 1.55;
      font-style: italic;
      color: rgba(244, 246, 246, .56);
    }
    #entryPrompt {
      margin: 24px auto 0;
      color: rgba(246, 247, 246, .82);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: .035em;
    }

    @media (max-width: 560px) {
      #introCopy { transform: translateY(-1vh); }
      #softrotTitle { margin-bottom: 24px; }
      #tagline { margin-top: 22px; }
      #entryPrompt { margin-top: 18px; }
    }


    @media (pointer: coarse), (max-width: 560px), (max-width: 960px) and (orientation: landscape) {
      #rainToggle, #autoplayToggle { min-width: 44px; min-height: 44px; }
      body.feed-live #rainToggle, body.feed-live #autoplayToggle { opacity: .38; }
      body.feed-live.controls-awake #rainToggle, body.feed-live.controls-awake #autoplayToggle { opacity: .7; }
    }
    @media (max-width: 960px) and (max-height: 500px) and (orientation: landscape) {
      #introCopy { transform: none; }
      #softrotTitle { font-size: 36px; margin-bottom: 10px; }
      #manifesto, #scrollLine { font-size: 14px; line-height: 1.4; }
      #scrollLine { margin-top: 8px; }
      #tagline { font-size: 15px; margin-top: 8px; line-height: 1.4; }
      #entryPrompt { margin-top: 10px; font-size: 15px; line-height: 1.4; }
    }

    body.beach #app,
    body.beach #atmosphere { visibility: hidden; pointer-events: none; }
    body.checkpoint #app { pointer-events: none; }
    #decision, #beach {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      z-index: 50;
    }
    #decision { z-index: 51; isolation: isolate; }
    body.checkpoint #decision,
    body.checkpoint-to-feed #decision {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 28px;
      padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
      color: rgba(246, 247, 246, .86);
    }
    #decision::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 50% 42%, #78848a 0%, #69757d 58%, #56626a 100%);
      opacity: 1;
      transition: opacity var(--checkpoint-beach-fade) ease;
      pointer-events: none;
    }
    body.checkpoint-beach #decision::before { opacity: 0; }
    body.checkpoint #decision { animation: checkpointIn var(--checkpoint-enter) cubic-bezier(.2,.65,.3,1) both; }
    body.checkpoint-to-feed #decision { animation: cardOut 950ms cubic-bezier(.3,.65,.5,1) both; pointer-events: none; }
    body.checkpoint-to-feed #app { visibility: visible; animation: cardIn 950ms cubic-bezier(.3,.65,.5,1) both; pointer-events: none; }
    body.checkpoint-to-feed.checkpoint-beach #beach { animation: cardOut 950ms cubic-bezier(.3,.65,.5,1) both; pointer-events: none; }
    body.checkpoint-question #decisionQuestion { opacity: 1; }
    #decisionQuestion {
      position: relative;
      z-index: 1;
      margin: 0;
      font: 400 clamp(34px, 7vw, 54px)/1.2 Georgia, "Times New Roman", serif;
      letter-spacing: -.025em;
      text-align: center;
      opacity: 0;
      transition: opacity var(--checkpoint-question-fade) ease;
    }
    body.checkpoint-question-gone #decisionQuestion,
    body.beach-ending #decisionQuestion { opacity: 0; transition-duration: var(--checkpoint-question-out); }
    #decisionChoices {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(32px, 10vw, 96px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--checkpoint-choices-fade) ease;
    }
    body.checkpoint-choices #decisionChoices { opacity: 1; pointer-events: auto; }
    body.beach-ending #decisionChoices { opacity: 0; pointer-events: none; transition-duration: 850ms; }
    #decisionChoices button {
      min-width: 52px;
      min-height: 48px;
      border: 0;
      background: transparent;
      color: rgba(246, 247, 246, .68);
      padding: 12px 14px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      transition: color 160ms ease, background-color 160ms ease;
    }
    #decisionChoices button:hover,
    #decisionChoices button:focus-visible { color: #fff; background: rgba(255,255,255,.07); }
    #decisionChoices button:focus-visible { outline: 1px solid rgba(255,255,255,.65); outline-offset: 2px; }
    #decisionChoices button:active { background: rgba(255,255,255,.13); }

    #beach { background: #53616a; isolation: isolate; }
    body.beach #beach,
    body.checkpoint-beach #beach { display: block; }
    #beachArt { display: block; width: 100%; height: 100%; pointer-events: none; }
    .beach-clouds { animation: cloudDrift 80s ease-in-out infinite alternate; }
    .beach-haze { opacity: .68; }
    .beach-far-wave, .beach-near-wave, .shore-wash, .wash-reach {
      transform-box: view-box;
      transform-origin: 50% 72%;
    }
    .beach-far-wave { animation: farApproach 19s linear infinite; animation-delay: -7s; }
    .beach-far-wave.second { animation-duration: 26s; animation-delay: -18s; }
    .beach-near-wave { animation: nearApproach 14.7s ease-in-out infinite; animation-delay: -5s; }
    .beach-near-wave.second { animation-duration: 21.3s; animation-delay: -14s; }
    .shore-wash { animation: irregularWash 17.6s ease-in-out infinite; }
    .wash-reach { animation: localWash 12.7s ease-in-out infinite; animation-delay: -4s; }
    .shore-foam { animation: foamBreak 17.6s ease-in-out infinite; }
    .foam-fragment { animation: foamDissolve 8.1s ease-in-out infinite; }
    .foam-fragment.second { animation-duration: 10.3s; animation-delay: -3s; }
    .foam-fragment.third { animation-duration: 13.7s; animation-delay: -8s; }
    .wet-sand { animation: wetSand 17.6s ease-in-out infinite; }
    .wet-sheen { animation: wetSheen 17.6s ease-in-out infinite; }
    .sea-reflection { animation: reflectionDrift 13s ease-in-out infinite alternate; }
    .portrait-shape { display: none; }
    @keyframes checkpointIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes cardIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes cardOut { from { transform: translateY(0); } to { transform: translateY(-100%); } }
    @keyframes cloudDrift { to { transform: translateX(2.5%); } }
    @keyframes reflectionDrift { to { transform: translate(1.5%, 1%); opacity: .11; } }
    @keyframes farApproach {
      0% { transform: translateY(-1.5%); opacity: 0; }
      24% { opacity: .15; }
      75% { opacity: .12; }
      100% { transform: translateY(2.5%); opacity: 0; }
    }
    @keyframes nearApproach {
      0% { transform: translate(-1%, -4%) scale(.95, .8); opacity: 0; }
      28% { opacity: .28; }
      68% { opacity: .42; }
      100% { transform: translate(1%, 8%) scale(1.04, 1.16); opacity: 0; }
    }
    @keyframes irregularWash {
      0%, 100% { transform: translateY(-3%) scaleY(.64); opacity: .46; }
      26% { transform: translate(.2%, 1.2%) scaleY(.98); opacity: .7; }
      39% { transform: translateY(2.6%) scaleY(1.1); opacity: .36; }
      52% { transform: translate(-.3%, 2%) scaleY(1.04); opacity: .35; }
      78% { transform: translateY(-2%) scaleY(.72); opacity: .56; }
    }
    @keyframes localWash {
      0%, 100% { transform: translateY(-.8%) scaleY(.87); opacity: .2; }
      43% { transform: translateY(1.2%) scaleY(1.08); opacity: .6; }
      72% { transform: translateY(.2%) scaleY(1); opacity: .32; }
    }
    @keyframes foamBreak {
      0%, 77%, 100% { opacity: .015; }
      24% { opacity: .5; }
      39% { opacity: .32; }
      56% { opacity: .09; }
    }
    @keyframes foamDissolve {
      0%, 100% { opacity: .18; }
      36% { opacity: .85; }
      74% { opacity: .28; }
    }
    @keyframes wetSand {
      0%, 100% { opacity: .12; }
      30% { opacity: .48; }
      43%, 62% { opacity: .7; }
      82% { opacity: .38; }
    }
    @keyframes wetSheen {
      0%, 100% { opacity: .04; }
      40%, 59% { opacity: .24; }
      78% { opacity: .12; }
    }
    @media (max-width: 600px) and (orientation: portrait) {
      .landscape-shape { display: none; }
      .portrait-shape { display: inline; }
      .beach-near-wave { animation-duration: 15.7s; }
      .beach-near-wave.second { animation-duration: 22.3s; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud, .rain-drop { animation: none !important; }
      .reveal, #intro, #soundPrompt { transition-duration: 0.01ms !important; }
      #feed { scroll-behavior: auto; }
      body.checkpoint #decision, body.checkpoint-to-feed #decision,
      body.checkpoint-to-feed.checkpoint-beach #beach,
      body.checkpoint-to-feed #app { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="atmosphere" aria-hidden="true">
    <div class="cloud-field">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <div class="cloud c4"></div>
    </div>
    <div id="rainVisual"></div>
  </div>

  <main id="app" aria-label="Softrot video feed">
    <div id="feed" aria-live="off">
      <section class="video-slide">
        <div class="phone">
          <div class="player-host" id="player-a"></div>
        </div>
      </section>
      <section class="video-slide">
        <div class="phone">
          <div class="player-host" id="player-b"></div>
        </div>
      </section>
      <section class="video-slide">
        <div class="phone">
          <div class="player-host" id="player-c"></div>
        </div>
      </section>
    </div>
  </main>

  <section id="intro" aria-label="Softrot introduction">
    <button id="soundPrompt" type="button">press anywhere to begin</button>

    <div id="introCopy">
      <h1 id="softrotTitle" class="reveal">Softrot</h1>
      <p id="manifesto" class="reveal">An experimental substitute for optimized short-form feeds.</p>
      <p id="scrollLine" class="reveal">Satisfy the urge to scroll<br>without being pulled anywhere.</p>
      <p id="tagline" class="reveal">Gentle brainrot from the forgotten corners of the internet.</p>
      <p id="entryPrompt" class="reveal">swipe to begin</p>
    </div>

    <audio id="introMusic" src="aquatic-ambience.mp3" preload="auto" loop></audio>
    <audio id="introRain" src="rain.mp3" preload="auto" loop></audio>
  </section>

  <div id="message"></div>
  <section id="decision" aria-label="Session checkpoint" aria-hidden="true">
    <h2 id="decisionQuestion" aria-hidden="true">softly rotten?</h2>
    <div id="decisionChoices" aria-hidden="true" inert>
      <button id="decisionYes" type="button">yes</button>
      <button id="decisionNo" type="button">no</button>
    </div>
  </section>
  <section id="beach" aria-label="Beach" aria-hidden="true">
    <svg id="beachArt" viewBox="0 0 1200 1000" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="beachSky" x2="0" y2="1"><stop stop-color="#303f49"/><stop offset=".66" stop-color="#697780"/><stop offset="1" stop-color="#ad9686"/></linearGradient>
        <radialGradient id="beachGlow"><stop stop-color="#d5aa86" stop-opacity=".51"/><stop offset="1" stop-color="#d5aa86" stop-opacity="0"/></radialGradient>
        <linearGradient id="beachSea" x2="0" y2="1"><stop stop-color="#6b8186"/><stop offset=".32" stop-color="#45636d"/><stop offset="1" stop-color="#294851"/></linearGradient>
        <linearGradient id="beachSand" x2="0" y2="1"><stop stop-color="#80776a"/><stop offset=".45" stop-color="#625d54"/><stop offset="1" stop-color="#474641"/></linearGradient>
        <linearGradient id="beachWet" x2="0" y2="1"><stop stop-color="#364e52" stop-opacity="0"/><stop offset=".48" stop-color="#33484a" stop-opacity=".68"/><stop offset=".9" stop-color="#3c4b49" stop-opacity=".45"/><stop offset="1" stop-color="#3c4b49" stop-opacity=".12"/></linearGradient>
        <linearGradient id="beachWash" x2="0" y2="1"><stop stop-color="#476d76" stop-opacity="0"/><stop offset=".28" stop-color="#365d6b" stop-opacity=".8"/><stop offset=".7" stop-color="#547f89" stop-opacity=".67"/><stop offset=".95" stop-color="#92afa9" stop-opacity=".24"/><stop offset="1" stop-color="#abc0b5" stop-opacity=".02"/></linearGradient>
        <linearGradient id="beachMist" x2="0" y2="1"><stop stop-color="#d3b7a0" stop-opacity=".04"/><stop offset=".45" stop-color="#d3b7a0" stop-opacity=".35"/><stop offset="1" stop-color="#d3b7a0" stop-opacity="0"/></linearGradient>

  <audio id="beachAudio" src="beach-ambience.mp3" preload="none" loop></audio>
  <button id="rainToggle" type="button" aria-pressed="true" title="Rain (R)">rain on</button>
  <button id="autoplayToggle" type="button" aria-pressed="true" title="Autoplay 20s (A)">auto 20s</button>

  <script type="module">
    import { getCandidates } from './discovery.js';

    // Checkpoint pacing: edit beat multipliers here; both motion modes share this clock.
    const BASE_BEAT = 900;
    const CHECKPOINT_INTERVAL = 15;
    const DEBUG_CHECKPOINT_TIMING = false;
    const CHECKPOINT_TIMING = {
      beat: BASE_BEAT,
      enter: 10 / 9, // Exactly 1000 ms with the shared 900 ms beat.
      enterBreathe: 1,
      questionFade: 1,
      questionBreathe: 1.5,
      beachFade: 2.5,
      beachBreathe: 1,
      choicesFade: 1,
      choicesBreathe: 2,
      questionOut: 1.5,
    };
    const checkpointMs = Object.fromEntries(Object.entries(CHECKPOINT_TIMING)
      .filter(([key]) => key !== 'beat')
      .map(([key, beats]) => [key, beats * CHECKPOINT_TIMING.beat]));
    let checkpointStartedAt = 0;
    function logCheckpointPhase(phase) {
      if (DEBUG_CHECKPOINT_TIMING) {
        console.log(`[checkpoint +${Math.round(performance.now() - checkpointStartedAt)}ms] ${phase}`);
      }
    }

    const WATCH_MS = 20000;
    const CURRENT_START_TIMEOUT_MS = 6000;
    const PROGRAMMATIC_SCROLL_MS = 650;
    const SCROLL_IDLE_MS = 90;
    const SNAP_EPSILON = 0.035;

    const app = document.querySelector('#app');
    const feed = document.querySelector('#feed');
    const intro = document.querySelector('#intro');
    const soundPrompt = document.querySelector('#soundPrompt');
    const softrotTitle = document.querySelector('#softrotTitle');
    const manifesto = document.querySelector('#manifesto');
    const scrollLine = document.querySelector('#scrollLine');
    const tagline = document.querySelector('#tagline');
    const entryPrompt = document.querySelector('#entryPrompt');
    const introMusic = document.querySelector('#introMusic');
    const introRain = document.querySelector('#introRain');
    const rainVisual = document.querySelector('#rainVisual');
    const messageEl = document.querySelector('#message');
    const decision = document.querySelector('#decision');
    const decisionChoices = document.querySelector('#decisionChoices');
    const decisionYes = document.querySelector('#decisionYes');
    const decisionNo = document.querySelector('#decisionNo');
    const beach = document.querySelector('#beach');
    const beachAudio = document.querySelector('#beachAudio');
    const autoplayToggle = document.querySelector('#autoplayToggle');
    const rainToggle = document.querySelector('#rainToggle');

    let candidates = [];
    let currentIndex = -1;
    let nextIndex = -1;
    const backStack = [];
    const recentIndices = [];
    const RECENT_LIMIT = 18;
    let feedEnabled = false;
    let introSoundStarted = false;
    let entryPromptReady = false;
    let introTouchStart = null;
    let introPointerStart = null;
    let introWheelDistance = 0;
    let introWheelResetTimer = null;
    let entering = false;
    let programmatic = false;
    let recycling = false;
    let scrolling = false;
    let scrollTimer = null;
    let recycleUnlockTimer = null;
    let watchTimer = null;
    let autoplayEnabled = true;
    let rainEnabled = true;
    let displayedAutoplayText = null;
    let queuedDirection = 0;
    let queuedDirectionTimer = null;
    let controlsSleepTimer = null;
    let watchedMs = 0;
    let lastWatchTickAt = 0;
    let sessionMode = 'intro';
    let sessionCount = 0;
    let sessionLimit = 0;
    let visitToken = 0;
    let countedVisitToken = 0;
    let beachAudioAvailable = true;
    let beachAudioPlaying = false;
    const checkpointSequenceTimers = [];
    const beachFadeTokens = new WeakMap();
    const audioFadeFrames = new WeakMap();
    let rainPlaybackGeneration = 0;
    let rainPauseTimer = null;
    const badIds = new Set();
    const badIdRecords = {};
    const BAD_IDS_STORAGE_KEY = '0views.bad-videos.v1';
    const DAY_MS = 24 * 60 * 60 * 1000;

    const slots = [...document.querySelectorAll('.video-slide')].map((el) => ({
      el,
      host: el.querySelector('.player-host'),
      player: null,
      ready: false,
      item: null,
      position: -1,
      visualReady: false,
      reportedVideoId: null,
      loadedForPlay: false,
      randomStartApplied: false,
      randomStartSeconds: null,
      randomProbeTimer: null,
      activationTimer: null,
      activationRetries: 0,
      audibleTimers: [],
    }));

    function badIdTtlMs(code) {
      // Removal/private/embed-denied errors are worth remembering longer.
      // HTML5/unknown failures can be transient, so let them expire quickly.
      return [100, 101, 150].includes(Number(code)) ? 30 * DAY_MS : DAY_MS;
    }

    function loadBadIdRecords() {
      try {
        const raw = localStorage.getItem(BAD_IDS_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return;
        const now = Date.now();
        let changed = false;
        for (const [id, record] of Object.entries(parsed)) {
          const code = Number(record?.code || 0);
          const timestamp = Number(record?.timestamp || 0);
          if (!/^[A-Za-z0-9_-]{11}$/.test(id) || !timestamp || now - timestamp > badIdTtlMs(code)) {
            changed = true;
            continue;
          }
          badIdRecords[id] = { code, timestamp };
          badIds.add(id);
        }
        if (changed) localStorage.setItem(BAD_IDS_STORAGE_KEY, JSON.stringify(badIdRecords));
      } catch (_) {}
    }

    function rememberBadId(id, code) {
      if (!id) return;
      badIds.add(id);
      badIdRecords[id] = { code: Number(code || 0), timestamp: Date.now() };
      try {
        localStorage.setItem(BAD_IDS_STORAGE_KEY, JSON.stringify(badIdRecords));
      } catch (_) {}
    }

    function randomUnit() {
      if (globalThis.crypto?.getRandomValues) {
        const a = new Uint32Array(1);
        crypto.getRandomValues(a);
        return a[0] / 4294967296;
      }
      return Math.random();
    }

    function randomInt(maxExclusive) {
      return maxExclusive > 0 ? Math.floor(randomUnit() * maxExclusive) : 0;
    }

    function shuffle(array) {
      const out = [...array];
      for (let i = out.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    }

    function wrap(n) {
      if (!candidates.length) return 0;
      return (n % candidates.length + candidates.length) % candidates.length;
    }

    function rememberRecent(index) {
      if (index < 0) return;
      const at = recentIndices.indexOf(index);
      if (at >= 0) recentIndices.splice(at, 1);
      recentIndices.push(index);
      if (recentIndices.length > RECENT_LIMIT) recentIndices.splice(0, recentIndices.length - RECENT_LIMIT);
    }

    function pickRandomGoodIndex(exclude = []) {
      if (!candidates.length) return -1;
      const excluded = new Set(exclude.filter(i => i >= 0));
      const recent = new Set(recentIndices);

      // Prefer genuinely fresh choices. Random probing avoids creating a hidden
      // sequential order in the pool.
      const attempts = Math.max(40, Math.min(300, candidates.length * 2));
      for (let i = 0; i < attempts; i++) {
        const idx = randomInt(candidates.length);
        const item = candidates[idx];
        if (item && !badIds.has(item.id) && !excluded.has(idx) && !recent.has(idx)) return idx;
      }

      // If the recent window covers too much of a small surviving pool, allow an
      // older repeat but still never choose a known-dead or explicitly excluded ID.
      const viable = [];
      for (let idx = 0; idx < candidates.length; idx++) {
        const item = candidates[idx];
        if (item && !badIds.has(item.id) && !excluded.has(idx)) viable.push(idx);
      }
      return viable.length ? viable[randomInt(viable.length)] : -1;
    }


    function viewportHeight() { return feed.clientHeight || window.innerHeight || 1; }
    function currentSlot() { return slots[1]; }

    function resetSessionCheckpoint() {
      sessionCount = 0;
      sessionLimit = CHECKPOINT_INTERVAL;
      countedVisitToken = visitToken;
    }

    function countSettledCurrent(slot) {
      if (sessionMode !== 'feed' || !feedEnabled || scrolling || programmatic ||
          slot !== currentSlot() || countedVisitToken === visitToken ||
          slot.item?.id !== candidates[currentIndex]?.id) return;
      try {
        if (slot.player.getPlayerState() !== YT.PlayerState.PLAYING ||
            slot.player.getVideoData()?.video_id !== slot.item.id) return;
      } catch (_) { return; }
      countedVisitToken = visitToken;
      sessionCount += 1;
    }

    function showFatal(text) {
      messageEl.textContent = text;
      messageEl.style.display = 'grid';
      intro.style.display = 'none';
    }

    function clearAudibleTimers(slot) {
      for (const timer of slot.audibleTimers || []) clearTimeout(timer);
      slot.audibleTimers = [];
    }

    function resetSlotPlayback(slot) {
      clearTimeout(slot.activationTimer);
      slot.activationTimer = null;
      slot.activationRetries = 0;
      slot.loadedForPlay = false;
      slot.randomStartApplied = false;
      slot.randomStartSeconds = null;
      if (slot.randomProbeTimer) clearTimeout(slot.randomProbeTimer);
      slot.randomProbeTimer = null;
      clearAudibleTimers(slot);
    }

    function observeSlotVideoId(slot) {
      let reportedId = null;
      try { reportedId = slot.player?.getVideoData?.()?.video_id || null; } catch (_) {}
      slot.reportedVideoId = reportedId;
      if (reportedId === slot.item?.id) slot.visualReady = true;
      else if (reportedId) slot.visualReady = false;
      slot.el.classList.toggle('visual-pending', !slot.visualReady);
    }

    function assignSlot(slot, index) {
      if (index < 0 || !candidates.length) return;
      slot.position = wrap(index);
      const item = candidates[slot.position];
      if (slot.item?.id !== item.id) {
        slot.visualReady = false;
        slot.reportedVideoId = null;
        slot.el.classList.add('visual-pending');
      }
      slot.item = item;
      resetSlotPlayback(slot);
      if (!slot.ready || !slot.player || !slot.item) return;
      try {
        slot.player.mute();
        slot.player.cueVideoById({ videoId: slot.item.id });
      } catch (_) {}
    }

    function assignAroundCurrent() {
      if (currentIndex < 0) return;
      const previous = backStack.length ? backStack[backStack.length - 1] : currentIndex;
      if (nextIndex < 0 || !candidates[nextIndex] || badIds.has(candidates[nextIndex].id) || nextIndex === currentIndex) {
        nextIndex = pickRandomGoodIndex([currentIndex, previous]);
      }
      assignSlot(slots[0], previous);
      assignSlot(slots[1], currentIndex);
      if (nextIndex >= 0) assignSlot(slots[2], nextIndex);
    }

    function setIframePolicy(slot) {
      try {
        const iframe = slot.player.getIframe();
        iframe.setAttribute('allow', 'autoplay; encrypted-media');
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      } catch (_) {}
    }

    function addWatchTimeThrough(now = performance.now()) {
      if (!lastWatchTickAt) {
        lastWatchTickAt = now;
        return;
      }

      const elapsed = Math.max(0, now - lastWatchTickAt);
      lastWatchTickAt = now;

      if (!autoplayEnabled || !feedEnabled || programmatic || scrolling) return;
      const slot = currentSlot();
      if (!slot?.player || !slot.ready) return;

      try {
        if (slot.player.getPlayerState() === YT.PlayerState.PLAYING) {
          watchedMs = Math.min(WATCH_MS, watchedMs + elapsed);
          updateAutoplayToggleLabel();
        }
      } catch (_) {}
    }

    function clearWatchTimer({ subtract = false } = {}) {
      if (subtract && lastWatchTickAt) addWatchTimeThrough();
      lastWatchTickAt = 0;
      if (watchTimer) clearInterval(watchTimer);
      watchTimer = null;
    }

    function resetWatchTimer() {
      clearWatchTimer({ subtract: true });
      watchedMs = 0;
      lastWatchTickAt = 0;
      updateAutoplayToggleLabel();
    }

    function startWatchTimer({ fresh = false } = {}) {
      if (fresh) resetWatchTimer();
      if (!autoplayEnabled || !feedEnabled || programmatic || scrolling) return;
      if (watchTimer) return;

      const slot = currentSlot();
      if (!slot?.player || !slot.ready) return;
      try {
        if (slot.player.getPlayerState() !== YT.PlayerState.PLAYING) return;
      } catch (_) { return; }

      if (watchedMs >= WATCH_MS) {
        watchedMs = WATCH_MS;
        programmaticMove(1);
        return;
      }

      lastWatchTickAt = performance.now();
      watchTimer = setInterval(() => {
        if (!autoplayEnabled || !feedEnabled) {
          clearWatchTimer({ subtract: true });
          return;
        }

        addWatchTimeThrough();
        if (watchedMs < WATCH_MS) return;

        clearWatchTimer();
        watchedMs = WATCH_MS;
        programmaticMove(1);
      }, 100);
    }

    function wakeControls() {
      if (!feedEnabled) return;
      document.body.classList.add('controls-awake');
      clearTimeout(controlsSleepTimer);
      controlsSleepTimer = setTimeout(() => {
        document.body.classList.remove('controls-awake');
      }, 3200);
    }

    function setAutoplayEnabled(enabled) {
      autoplayEnabled = Boolean(enabled);
      if (autoplayEnabled) {
        resetWatchTimer();
        if (feedEnabled && !scrolling && !programmatic) startWatchTimer();
      } else {
        clearWatchTimer();
      }
      updateAutoplayToggleLabel();
    }

    function updateAutoplayToggleLabel() {
      const remainingSeconds = Math.ceil(Math.max(0, WATCH_MS - watchedMs) / 1000);
      const text = autoplayEnabled ? `auto ${remainingSeconds}s` : 'auto off';
      if (text === displayedAutoplayText) return;
      displayedAutoplayText = text;
      autoplayToggle.setAttribute('aria-pressed', autoplayEnabled ? 'true' : 'false');
      autoplayToggle.setAttribute('aria-label', autoplayEnabled
        ? `Autoplay on, ${remainingSeconds} seconds remaining. Press A to turn off.`
        : 'Autoplay off. Press A to turn on.');
      autoplayToggle.textContent = text;
    }

    autoplayToggle.addEventListener('click', () => {
      wakeControls();
      setAutoplayEnabled(!autoplayEnabled);
    });

    function setRainEnabled(enabled, immediate = false) {
      rainPlaybackGeneration++;
      clearTimeout(rainPauseTimer);
      rainPauseTimer = null;
      cancelAudioFade(introRain);
      rainEnabled = Boolean(enabled);
      rainToggle.setAttribute('aria-pressed', rainEnabled ? 'true' : 'false');
      rainToggle.setAttribute('aria-label', rainEnabled ? 'Rain on. Press R to turn off.' : 'Rain off. Press R to turn on.');
      rainToggle.textContent = rainEnabled ? 'rain on' : 'rain off';

      if (rainEnabled) {
        try {
          introRain.loop = true;
          const result = introRain.play();
          if (result && typeof result.catch === 'function') result.catch(() => {});
          fadeAudio(introRain, feedEnabled ? 0.075 : 0.13, 450);
        } catch (_) {}
      } else if (immediate) {
        introRain.volume = 0;
        try { introRain.pause(); } catch (_) {}
      } else {
        fadeAudio(introRain, 0, 350);
        rainPauseTimer = setTimeout(() => {
          if (!rainEnabled) {
            try { introRain.pause(); } catch (_) {}
          }
        }, 380);
      }
    }

    rainToggle.addEventListener('click', () => {
      wakeControls();
      setRainEnabled(!rainEnabled);
    });

    function pauseCurrentForScroll() {
      const slot = currentSlot();
      if (!slot?.player || !slot.ready) return;
      clearWatchTimer({ subtract: true });
      try {
        slot.player.mute();
        slot.player.pauseVideo();
      } catch (_) {}
    }

    function chooseRandomStart(slot, { seek = true } = {}) {
      if (!slot?.player || slot.randomStartApplied) return true;
      const duration = Number(slot.player.getDuration?.() || 0);
      if (!Number.isFinite(duration) || duration <= 0) return false;

      // Leave enough room for the configured watch window. Very short clips
      // necessarily start at 0; longer clips genuinely start at a random point.
      const safety = 1;
      const maxStart = Math.max(0, Math.floor(duration - WATCH_MS / 1000 - safety));
      const startAt = maxStart > 0 ? randomInt(maxStart + 1) : 0;
      slot.randomStartSeconds = startAt;
      slot.randomStartApplied = true;
      if (seek) {
        try {

        document.body.classList.add('beach-ending');
        setTimeout(() => {
          document.body.classList.remove('checkpoint', 'checkpoint-beach', 'checkpoint-choices', 'checkpoint-question-gone', 'beach-ending');
          document.body.classList.add('beach');
          decision.setAttribute('aria-hidden', 'true');
        }, reducedMotion ? 0 : 850);
      }, reducedMotion ? 0 : 250);
    }

    function resumeFreshSession() {
      if (sessionMode !== 'decision' || decisionChoices.inert) return;
      setRainEnabled(false, true);
      clearCheckpointSequence();
      decisionNo.blur?.();
      sessionMode = 'transition';
      const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
      setTimeout(() => {
        document.body.classList.remove('checkpoint', 'checkpoint-choices', 'checkpoint-question-gone');
        document.body.classList.add('checkpoint-to-feed');
        decision.setAttribute('aria-hidden', 'true');
        beach.setAttribute('aria-hidden', 'true');
        fadeBeachAudio(beachAudio, 0, 1000, () => {
          if (sessionMode === 'feed') {
            beachAudio.pause();
            beachAudioPlaying = false;
          }
        });
        setTimeout(() => {
          document.body.classList.remove('checkpoint-to-feed', 'checkpoint-beach');
          document.body.classList.add('feed-live');
          sessionMode = 'feed';
          resetSessionCheckpoint();
          feedEnabled = true;
          // Begin the next video only after the feed card has settled.
          commitDirection(1);
        }, reducedMotion ? 0 : 950);
      }, reducedMotion ? 0 : 250);
    }

    beachAudio.addEventListener('error', () => { beachAudioAvailable = false; });
    decisionYes.addEventListener('click', showBeach);
    decisionNo.addEventListener('click', resumeFreshSession);
    decision.addEventListener('wheel', (event) => event.preventDefault(), { passive: false });
    document.addEventListener('keydown', (event) => {
      if (sessionMode === 'decision' &&
          ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
        event.preventDefault();
      }
    });

    function tryStartAudio(audio, target) {
      if (!audio || (audio === introRain && !rainEnabled)) return;
      const rainGeneration = rainPlaybackGeneration;
      const fadeStartedAudio = () => {
        if (audio === introRain && (rainGeneration !== rainPlaybackGeneration || !rainEnabled)) return;
        fadeAudio(audio, target, 1800);
      };
      try {
        audio.volume = 0;
        audio.currentTime = 0;
        const result = audio.play();
        if (result && typeof result.then === 'function') {
          result.then(fadeStartedAudio).catch(() => {});
        } else {
          fadeStartedAudio();
        }
      } catch (_) {}
    }

    function revealIntroCopy() {
      const reveal = (element, delay, isEntry = false) => setTimeout(() => {
        element.classList.add('shown');
        if (isEntry) entryPromptReady = true;
      }, delay);

      reveal(softrotTitle, 900);
      reveal(manifesto, 2500);
      reveal(scrollLine, 4350);
      reveal(tagline, 6650);
      reveal(entryPrompt, 9200, true);
    }

    intro.addEventListener('click', () => {
      if (introSoundStarted) return;
      introSoundStarted = true;
      soundPrompt.classList.add('fading');
      setTimeout(() => { soundPrompt.style.display = 'none'; }, 700);
      tryStartAudio(introMusic, 0.35);
      if (rainEnabled) tryStartAudio(introRain, 0.13);
      revealIntroCopy();
    });

    intro.addEventListener('pointerdown', (event) => {
      if (event.pointerType !== 'mouse' || !entryPromptReady || entering) return;
      introPointerStart = { x: event.clientX, y: event.clientY };
    }, { passive: true });

    intro.addEventListener('pointerup', (event) => {
      const start = introPointerStart;
      introPointerStart = null;
      if (!start || !entryPromptReady || entering) return;
      const deltaX = event.clientX - start.x;
      const upwardDistance = start.y - event.clientY;
      if (upwardDistance >= 60 && upwardDistance > Math.abs(deltaX) * 1.2) enterFeed();
    }, { passive: true });

    intro.addEventListener('pointercancel', () => { introPointerStart = null; }, { passive: true });

    intro.addEventListener('wheel', (event) => {
      if (!introSoundStarted || !entryPromptReady || entering) return;
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
      const deltaY = event.deltaY * unit;
      const deltaX = event.deltaX * unit;
      if (Math.abs(deltaX) >= Math.abs(deltaY)) return;
      if (deltaY <= 0) {
        introWheelDistance = 0;
        clearTimeout(introWheelResetTimer);
        introWheelResetTimer = null;
        return;
      }

      introWheelDistance += deltaY;
      clearTimeout(introWheelResetTimer);
      introWheelResetTimer = setTimeout(() => {
        introWheelDistance = 0;
        introWheelResetTimer = null;
      }, 200);
      if (introWheelDistance >= 60) {
        event.preventDefault();
        enterFeed();
      }
    }, { passive: false });

    intro.addEventListener('touchstart', (event) => {
      if (event.touches.length !== 1) {
        introTouchStart = null;
        return;
      }
      introTouchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
    }, { passive: true });

    intro.addEventListener('touchend', (event) => {
      const start = introTouchStart;
      introTouchStart = null;
      if (!start || !entryPromptReady || entering) return;
      const touch = event.changedTouches[0];
      if (!touch) return;
      const deltaX = touch.clientX - start.x;
      const upwardDistance = start.y - touch.clientY;
      if (upwardDistance >= 60 && upwardDistance > Math.abs(deltaX) * 1.2) enterFeed();
    }, { passive: true });

    intro.addEventListener('touchcancel', () => { introTouchStart = null; }, { passive: true });

    document.addEventListener('keydown', (event) => {
      if (feedEnabled || !entryPromptReady) return;
      if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (!event.repeat) enterFeed();
      } else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        enterFeed();
      }
    });

    function enterFeed() {
      if (entering || !entryPromptReady) return;
      entering = true;
      sessionMode = 'feed';
      resetSessionCheckpoint();
      visitToken += 1;
      clearTimeout(introWheelResetTimer);
      introWheelResetTimer = null;
      introWheelDistance = 0;
      feedEnabled = true;
      document.body.classList.add('feed-live');
      wakeControls();
      app.classList.add('entered');
      intro.classList.add('leaving');

      // Let the ambience disappear, but keep the rain as the quiet bed under the feed.
      fadeAudio(introMusic, 0, 1100);
      document.body.appendChild(introRain);
      introRain.loop = true;
      if (rainEnabled) {
        fadeAudio(introRain, 0.075, 1800);
      } else {
        try { introRain.pause(); introRain.volume = 0; } catch (_) {}
      }

      resetWatchTimer();
      muteNonCurrent();
      startCurrent();
      setTimeout(() => {
        try { introMusic.pause(); introMusic.currentTime = 0; introMusic.volume = 0; } catch (_) {}
        intro.remove();
      }, 1250);
    }

    try {
      setAutoplayEnabled(true);
      setRainEnabled(true);
      makeRain();
      loadBadIdRecords();
      const loaded = await getCandidates();
      // Deduplicate by video ID. The feed uses a three-player recycling window;
      // every forward branch is still selected independently at random.
      candidates = [...new Map(loaded.filter(item => item?.id).map(item => [item.id, item])).values()];
      if (!candidates.length) throw new Error('No valid candidate IDs found.');
      currentIndex = pickRandomGoodIndex();
      if (currentIndex < 0) throw new Error('No playable candidates remain in this local pool.');
      rememberRecent(currentIndex);
      nextIndex = pickRandomGoodIndex([currentIndex]);
      assignAroundCurrent();
      requestAnimationFrame(() => requestAnimationFrame(centerFeedInstantly));
      const yt = document.createElement('script');
      yt.src = 'https://www.youtube.com/iframe_api';
      yt.onerror = () => showFatal('Could not load the YouTube player. Check your connection and reload.');
      document.head.appendChild(yt);
    } catch (error) {
      showFatal(error.message || String(error));
    }
  </script>
</body>
</html>
